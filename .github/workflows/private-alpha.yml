name: Private alpha packages
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Create a new private prerelease after all package checks pass
        required: true
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: private-alpha-packages
  cancel-in-progress: false
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
            arch: x86_64
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
          - runner: macos-15
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s tests -v
      - name: Build native package and standalone installer
        run: sh packaging/${{ matrix.platform }}/build-alpha.sh
      - name: Exercise package lifecycle with disposable notes
        run: |
          VERSION=$(python -c 'from notryn_version import VERSION; print(VERSION)')
          EXT=zip
          if test '${{ matrix.platform }}' = linux; then EXT=tar.gz; fi
          python scripts/test-package.py "dist/Notryn-$VERSION-${{ matrix.platform }}-${{ matrix.arch }}.$EXT"
          "dist/notryn-setup-${{ matrix.platform }}-${{ matrix.arch }}" --help
      - uses: actions/upload-artifact@v4
        with:
          name: notryn-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: dist/*
  release:
    if: ${{ inputs.publish_release }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: notryn-*
          merge-multiple: true
          path: release
      - name: Publish new private prerelease without replacing old assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh repo view --json visibility --jq .visibility)" = PRIVATE
          VERSION=$(python3 -c 'from notryn_version import VERSION; print(VERSION)')
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'This version already exists. Bump the version; releases must not be overwritten.' >&2
            exit 1
          fi
          gh release create "$TAG" release/* --target "$GITHUB_SHA" --prerelease --title "Notryn $VERSION private alpha" --notes-file docs/PRIVATE-ALPHA.md

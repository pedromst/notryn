name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s tests -v

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - name: Keep repository line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        shell: pwsh
        run: npm ci
      - name: Node tests
        shell: pwsh
        run: npm test
      - name: Python tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Build unsigned Windows package
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File packaging\windows\build.ps1
      - name: Exercise installer against the built package
        shell: powershell
        run: |
          $version = python -c "from notryn_version import VERSION; print(VERSION)"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File packaging\windows\test-install.ps1 -Package "dist\Notryn-$version-windows-x86_64.zip" -ChecksumFile "dist\Notryn-$version-windows-x86_64.zip.sha256" -Smoke "$PWD\scripts\windows-smoke.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-package
          if-no-files-found: ignore
          path: |
            dist/*.zip
            dist/*.sha256

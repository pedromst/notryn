name: Bug report
description: Report reproducible behavior that is not working as expected.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include real notes, credentials or personal paths. Report security issues privately through the Security tab.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Explain what you did, what appeared and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open…\n2. Choose…\n3. See…"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, browser and Notryn version or commit.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add a screenshot with private content removed if it helps.
